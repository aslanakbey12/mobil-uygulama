# Render Blueprint — bu repoyu Render'a bağlayınca otomatik yapılandırır.
# (Render → New → Blueprint → repo seç; ya da manuel Web Service kurup aynı ayarları gir.)
services:
  - type: web
    name: kelime-odalari-server
    runtime: node
    plan: free                    # ücretsiz katman (15 dk hareketsizlikte uyur, ilk istekte ~1 dk uyanır)
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      # Node sürümü SABİT. package.json'daki ">=20" Render'ın her dağıtımda farklı
      # bir majör seçmesine izin veriyordu — sunucunun altındaki zemin habersiz
      # değişmemeli. fastify 5 Node 20+ istiyor; 22 LTS güvenli orta yol.
      - key: NODE_VERSION
        value: "22"
      # Eşleştirme: gerçek çok-oyunculu (2 kişi gerekir), 15 sn'de gevşe
      - key: MATCH_MIN
        value: "2"
      - key: MATCH_IDEAL
        value: "4"
      - key: MATCH_RELAX_MS
        value: "15000"
      - key: MATCH_OVERLAP_MIN
        value: "3"
      # Günlük oda kotası artık bir ÜRÜN SINIRI DEĞİL, kötüye kullanım freni.
      # Sosyal odalar can harcıyor (SOCIAL_COST: yazılı/sesli 50, oyun 75) ve
      # 200'lük depo + saatlik yenilenmeyle günde ~16 oturum tavanı zaten oluşuyor.
      # Yani bu sayı normal kullanımda HİÇ devreye girmez; sadece otomatik oda
      # açan bir istismarı keser. Paywall'da artık reklamı yapılmıyor: kullanıcıya
      # iki ayrı sebepten "hayır" demek, neden durduğunu anlaşılmaz kılıyordu.
      - key: FREE_DAILY_ROOMS
        value: "25"
      # Okuma kotası KADEMEYE DUYARLI (reading.js). Her parça bir Gemini çağrısı;
      # premium bile "sınırsız" değil, yüksek tavanlı.
      - key: READING_DAILY_CAP
        value: "3"
      - key: READING_DAILY_CAP_PREMIUM
        value: "30"
      # ÜRETİM: 0 olmalı. 1 iken isPremium() HERKES için true döner → paywall/kota devre dışı, gelir 0.
      - key: DEV_PREMIUM
        value: "0"
      # Doğrulanmamış header'a (x-user-id) GÜVENME → tam kimlik kilidi. Supabase env'leri gerekir.
      - key: AUTH_STRICT
        value: "1"
      # ── YZ MALİYET FRENLERİ ──
      # Kullanıcı başına günlük çağrı sınırı.
      - key: AI_DAILY_CAP
        value: "300"
      # Çeviri AYRI kotada: kart çevirileri minik ve önbellekli, asıl YZ hakkını yemesin.
      - key: AI_TRANSLATE_DAILY_CAP
        value: "600"
      # SİSTEM GENELİ günlük tavan. Kullanıcı başına tavanlar toplam harcamayı
      # sınırlamıyordu (1000 kullanıcı × 300 = frensiz 300 bin çağrı). Bu asıl frendir.
      # Sayaçlar ai_usage/ai_usage_global tablolarında KALICI (db/12_perf_quota.sql) —
      # dağıtım ya da uyku kotayı sıfırlamaz.
      - key: AI_GLOBAL_DAILY_CAP
        value: "20000"
      # YZ uçlarına KULLANICI BAŞINA anlık hız sınırı (dakikada). IP sınırı mobil
      # operatör NAT'ı yüzünden cömert olmak zorunda; bu, tek hesabın pahalı uçları
      # dövmesini keser.
      - key: AI_RL_MAX
        value: "20"
      # İstek gövde sınırı. /progress ağır kullanıcıda ~700 KB jsonb gönderiyor;
      # Fastify varsayılanı 1 MB idi ve sınıra dayanıyorduk.
      - key: BODY_LIMIT
        value: "2097152"
      # ── CORS ──
      # BOŞ BIRAKMA. Boşsa "*" olur ve HERHANGİ bir site, tarayıcıdaki kullanıcının
      # token'ıyla API'ye istek atabilir. Web sürümünün adresini yaz (virgülle çoğalt).
      - key: CORS_ORIGINS
        value: "https://adorable-llama-463991.netlify.app"
      # ── PANELDEN (Dashboard → Environment) GİZLİ OLARAK GİRİLECEK env'ler ──
      #   SUPABASE_URL, SUPABASE_SERVICE_KEY   (auth + DB + AUTH_STRICT için ŞART)
      #   GEMINI_API_KEY            (okuma/AI sohbet)
      #   PEXELS_API_KEY            (kelime görselleri)
      #   REVENUECAT_WEBHOOK_TOKEN  (premium webhook — YOKSA webhook artık FAIL-CLOSED reddeder)
      #
      # NOT: SUPABASE_JWT_SECRET ARTIK GEREKMİYOR. Doğrulama JWKS ile asimetrik
      # (ES256) yapılıyor — paylaşılan sırra ihtiyaç yok. Ortamda duruyorsa SİL:
      # kullanılmayan bir sır sadece sızma riski taşır, hiçbir fayda sağlamaz.
      # LiveKit boş → sesli oda clip-relay ile çalışır (LIVEKIT_* opsiyonel).
      # PORT'u ELLE GİRME — Render otomatik atar, kod process.env.PORT'u okur.
